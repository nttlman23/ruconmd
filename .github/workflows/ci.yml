name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee test.log
      - name: Report failed tests
        if: failure()
        shell: bash
        run: if [ -f test.log ]; then python .github/scripts/report_failures.py test.log; fi
      # Для ручной проверки, это не выпуск.
      - name: Build exe
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          cargo build --locked --release
          ./target/release/ruconmd.exe --version
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: runner.os == 'Windows' && github.event_name == 'push'
        with:
          name: ruconmd-windows-x86_64
          path: target/release/ruconmd.exe
          if-no-files-found: error
          retention-days: 14

  # Наименьшая версия Rust, объявленная в Cargo.toml.
  minimal-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          cargo "+$version" build --locked

  # Скрипты установки, без сети. Windows: обе оболочки.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - if: runner.os == 'Linux'
        run: |
          found=$(shellcheck -f gcc install.sh) || { printf '%s\n' "$found" | sed 's/^/::error::/'; exit 1; }
          sh .github/scripts/test_install.sh dash
          sh .github/scripts/test_install.sh bash
      - if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/test_install.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: .github/scripts/test_install.ps1

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          rust-version: stable
