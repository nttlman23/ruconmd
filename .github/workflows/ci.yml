name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee test.log
      - name: Report failed tests
        if: failure()
        shell: bash
        run: if [ -f test.log ]; then python .github/scripts/report_failures.py test.log; fi
      # Для ручной проверки, это не выпуск.
      - name: Build exe
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          cargo build --locked --release
          ./target/release/ruconmd.exe --version
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows' && github.event_name == 'push'
        with:
          name: ruconmd-windows-x86_64
          path: target/release/ruconmd.exe
          if-no-files-found: error
          retention-days: 14
