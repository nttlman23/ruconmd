name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast 2>&1 | tee test.log
      - name: Report failed tests
        if: failure()
        shell: bash
        run: if [ -f test.log ]; then python .github/scripts/report_failures.py test.log; fi
      # Для ручной проверки, это не выпуск.
      - name: Build exe
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          cargo build --locked --release
          ./target/release/ruconmd.exe --version
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows' && github.event_name == 'push'
        with:
          name: ruconmd-windows-x86_64
          path: target/release/ruconmd.exe
          if-no-files-found: error
          retention-days: 14

  # Наименьшая версия Rust, объявленная в Cargo.toml.
  minimal-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          rustup toolchain install "$version" --profile minimal
          cargo "+$version" build --locked

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # v2.1.3
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd
        with:
          rust-version: stable
