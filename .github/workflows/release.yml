name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: ruconmd
            platform: linux-x86_64
            update: bin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: ruconmd.exe
            platform: windows-x86_64
            update: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      NAME: ruconmd-${{ github.ref_name }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Tag matches the package version
        run: grep -qx "version = \"${TAG#v}\"" Cargo.toml
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable && rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --locked --no-fail-fast --target ${{ matrix.target }} 2>&1 | tee test.log
      # Упавшие тесты видны в сводке без входа в журнал.
      - name: Report failed tests
        if: failure()
        run: if [ -f test.log ]; then python .github/scripts/report_failures.py test.log; fi
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Pack
        run: |
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$NAME/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE config.example.toml "$NAME/"
          python .github/scripts/third_party.py "${{ matrix.target }}" "$NAME/THIRD-PARTY.txt"
          "./$NAME/${{ matrix.bin }}" --version
          # Этот файл загружает программа, когда обновляется.
          cp "$NAME/${{ matrix.bin }}" "$NAME.${{ matrix.update }}"
          if [ "$RUNNER_OS" = Windows ]; then 7z a "$NAME.zip" "$NAME"; else tar czf "$NAME.tar.gz" "$NAME"; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.platform }}
          path: |
            *.zip
            *.tar.gz
            ruconmd-v*-x86_64.${{ matrix.update }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp install.sh install.ps1 dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          # Раздел этой версии без заголовка.
          awk -v v="## ${TAG#v}" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md
          case "$TAG" in *-*) kind=--prerelease ;; *) kind=--latest ;; esac
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $kind --title "$TAG" --notes-file notes.md
