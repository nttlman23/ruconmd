[package]
name = "ruconmd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Console Markdown editor with a full-screen preview mode"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
ratatui = "0.30.2"
sys-locale = "0.3.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
