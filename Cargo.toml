[package]
name = "ruconmd"
version = "0.1.0-beta.6"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nttlman23/ruconmd"
description = "Console Markdown editor with a full-screen preview mode"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
chardetng = "1.0.0"
clap = { version = "4.6.9", features = ["derive"] }
encoding_rs = "0.8.44"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
linkify = "0.12.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
regex = "1.13.2"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
semver = "1.0.28"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sha2 = "0.10.9"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
sys-locale = "0.3.2"
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25.20", default-features = false, features = ["parse", "display"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
ureq = { version = "3.5", default-features = false, features = ["rustls", "win-system-proxy"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
portable-pty = "0.9.0"
tempfile = "3.27.0"
vt100 = "0.18.1"

[target."cfg(unix)".dependencies]
rustix = { version = "1", default-features = false, features = ["std", "event", "fs", "termios", "stdio"] }
signal-hook = { version = "0.3", default-features = false }
