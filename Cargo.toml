[package]
name = "ruconmd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Console Markdown editor with a full-screen preview mode"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
chardetng = "1.0.0"
clap = { version = "4.6.9", features = ["derive"] }
encoding_rs = "0.8.44"
ratatui = "0.30.2"
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
sys-locale = "0.3.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
